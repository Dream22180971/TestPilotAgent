[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testpilot-agent"
version = "0.2.0"
description = "测试人的 AI 工作台 — 终端 TUI + CLI，把需求文档变成测试资产"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.10",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openai>=1.58",
    "openpyxl>=3.1",
    "textual>=1.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.19",
]

[project.scripts]
tpa = "testpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["testpilot"]
