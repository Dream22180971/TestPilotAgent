name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testpilot-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testpilot-web/package-lock.json
      - run: npm ci
      - run: npm run build

  api-syntax:
    name: api-syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testpilot-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
